<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="SSLim — тонкий транспорт IP-пакетов поверх TLS 1.3">
  <title>SSLim</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="0.62" stop-color="#e0f2fe" stop-opacity="1"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- blade slash -->
  <g transform="rotate(-24 940 150)">
    <rect x="500" y="147" width="790" height="6" rx="3" fill="url(#blade)"/>
    <rect x="500" y="161" width="790" height="1" fill="#38bdf8" opacity="0.22"/>
  </g>

  <!-- accent -->
  <rect x="74" y="78" width="36" height="3" rx="1.5" fill="#38bdf8"/>

  <!-- wordmark -->
  <text x="70" y="168" font-family="'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="2">
    <tspan fill="#f1f5f9">SSL</tspan><tspan fill="url(#slim)">im</tspan>
  </text>

  <!-- tagline -->
  <text x="74" y="208" font-family="'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#8fa3bf">Тонкий транспорт IP-пакетов поверх TLS 1.3</text>

  <!-- chips -->
  <g font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#7dd3fc" text-anchor="middle">
    <rect x="72" y="244" width="58" height="30" rx="15" fill="#0e1526" stroke="#1e2a44"/>
    <text x="101" y="264">Rust</text>
    <rect x="142" y="244" width="78" height="30" rx="15" fill="#0e1526" stroke="#1e2a44"/>
    <text x="181" y="264">TLS 1.3</text>
    <rect x="232" y="244" width="104" height="30" rx="15" fill="#0e1526" stroke="#1e2a44"/>
    <text x="284" y="264">IPv4 · IPv6</text>
    <rect x="348" y="244" width="146" height="30" rx="15" fill="#0e1526" stroke="#1e2a44"/>
    <text x="421" y="264">QUIC DATAGRAM</text>
    <rect x="506" y="244" width="66" height="30" rx="15" fill="#0e1526" stroke="#1e2a44"/>
    <text x="539" y="264">Blade</text>
  </g>
</svg>
