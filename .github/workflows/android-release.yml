name: Release Android Blade

on:
  push:
    branches: [main]
    paths:
      - android/AndroidManifest.xml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build signed Android APK
        shell: pwsh
        env:
          BLADE_SIGN_STORE: ${{ secrets.BLADE_SIGN_STORE }}
          BLADE_SIGN_PASS: ${{ secrets.BLADE_SIGN_PASS }}
        run: |
          $sdk = $env:ANDROID_HOME
          $manager = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $manager --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK install failed' }
          if ($env:BLADE_SIGN_STORE -and $env:BLADE_SIGN_PASS) {
            $store = Join-Path $env:RUNNER_TEMP 'blade-signing.p12'
            try {
              [IO.File]::WriteAllBytes($store, [Convert]::FromBase64String($env:BLADE_SIGN_STORE))
              ./android/build.ps1 -Sdk $sdk -Jdk $env:JAVA_HOME -SigningStore $store
            } finally {
              Remove-Item -LiteralPath $store -ErrorAction SilentlyContinue
            }
          } else {
            Write-Warning 'No persistent signing secrets: APK gets an ephemeral debug signing key and may not update an existing install.'
            ./android/build.ps1 -Sdk $sdk -Jdk $env:JAVA_HOME
          }
      - name: Publish v0.5.0 with Blade APK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.5.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists" }
          $notes = @'
          Android Blade 0.5.0:
          - Faster TUN/TLS forwarding with batching and bounded queues.
          - Settings split into Profiles and App settings.
          - DNS choices: Cloudflare, Google, Quad9.
          - Reconnection and performance logging preferences.
          - Android Always-on VPN / Block connections without VPN support for a real kill switch.
          - Enable kill switch manually: Blade > Settings > App settings > Kill switch > Android VPN settings, then enable both Android switches.
          If the APK uses a different signing certificate than your installed Blade, back up your VPN profile before uninstalling.
          '@
          gh release create $tag android/build/Blade.apk --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY --title "SSLim v0.5.0 — Blade Android" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
