name: Publish SSLim release

on:
  workflow_run:
    workflows: ["Build packages"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-sslim-v0.6.0
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate 0.6.0 release versions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'version = "0.6.0"' Cargo.toml
          grep -Fq 'android:versionName="0.6.0"' android/AndroidManifest.xml
          grep -Fxq 'version = "0.6.0"' android/native/Cargo.toml

      - name: Retrieve platform builds from the successful main CI run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist/staging/linux dist/staging/windows dist/staging/android
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name sslim-linux-x86_64 --dir dist/staging/linux
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name sslim-windows-x86_64 --dir dist/staging/windows
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name Blade-Android --dir dist/staging/android
          install -m 0644 dist/staging/linux/sslim-linux-x86_64.tar.gz dist/sslim-linux-x86_64.tar.gz
          install -m 0644 dist/staging/windows/sslim-windows-x86_64.zip dist/sslim-windows-x86_64.zip
          install -m 0644 dist/staging/android/Blade.apk dist/Blade.apk
          (
            cd dist
            sha256sum sslim-linux-x86_64.tar.gz sslim-windows-x86_64.zip Blade.apk > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Write release notes
        shell: bash
        run: |
          cat > dist/RELEASE_NOTES.md <<'NOTES'
          ## SSLim 0.6.0 — Android, Linux and Windows

          ### Android Blade
          - System, dark and light themes; Blade Mint, Arctic Blue, Soft Lavender, Warm Amber and custom HSV/HEX accents.
          - Orbit, Aurora, Data Stream, Spectrum and Crystal animation styles with coordinated menu effects, motion and haptics.
          - Round/square connection button, interactive preview, redesigned profiles and settings.
          - Manual-only GitHub Releases update checker; no automatic download or install.
          - Android system Always-on VPN and "Block connections without VPN" kill switch settings guide.
          - Experimental UDP/QUIC v3 transport: Auto / TCP / QUIC selection, encrypted datagrams and optional TCP fallback only for UDP unavailability.

          ### Linux and Windows
          - Bare `sslim` opens interactive nested menus with arrows, Enter and numeric fallback; existing subcommands remain script-compatible.
          - Improved client profile management, QR links, manual version checking, and server administration.
          - Linux opt-in UDP listener: `--udp-port 9443` alongside unchanged TCP v1. UDP requires firewall allowance and a new 0.6.0 Linux server; the old standalone QUIC v2 remains separate.
          - Shared TCP/QUIC authentication and isolated peer TUN addresses.

          ### Compatibility and cautions
          - Existing `sslim://` profiles, certificate paths and clients.txt keyring are preserved.
          - The Android UDP feature is experimental; real-device networking, failover and performance may vary.
          - When upgrading a Linux server installed via install-server.sh, back up `/etc/sslim` and the systemd unit. The updated installer keeps existing network/service configuration on upgrade, and therefore does not enable UDP by itself.
          - Android APK update-in-place may fail if the signing key differs from your installed APK. Back up profiles before uninstalling the previous version.
          - UDP/QUIC changes apply only to v3 and opt-in server mode; old TCP behavior remains supported.
          NOTES

      - name: Publish tag and all three packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag=v0.6.0
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving the published assets unchanged."
            exit 0
          fi
          gh release create "$tag" \
            dist/sslim-linux-x86_64.tar.gz \
            dist/sslim-windows-x86_64.zip \
            dist/Blade.apk \
            dist/SHA256SUMS \
            --target "$COMMIT_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SSLim v0.6.0 — Blade, interactive CLI and QUIC v3" \
            --notes-file dist/RELEASE_NOTES.md
