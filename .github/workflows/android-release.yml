name: Publish SSLim release

on:
  workflow_run:
    workflows: ["Build packages"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-sslim-v0.6.1
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate 0.6.1 release versions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'version = "0.6.1"' Cargo.toml
          grep -Fq 'android:versionName="0.6.1"' android/AndroidManifest.xml
          grep -Fxq 'version = "0.6.1"' android/native/Cargo.toml

      - name: Retrieve platform builds from the successful main CI run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist/staging/linux dist/staging/windows dist/staging/android
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name sslim-linux-x86_64 --dir dist/staging/linux
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name sslim-windows-x86_64 --dir dist/staging/windows
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name Blade-Android --dir dist/staging/android
          install -m 0644 dist/staging/linux/sslim-linux-x86_64.tar.gz dist/sslim-linux-x86_64.tar.gz
          install -m 0644 dist/staging/windows/sslim-windows-x86_64.zip dist/sslim-windows-x86_64.zip
          install -m 0644 dist/staging/android/Blade.apk dist/Blade.apk
          (
            cd dist
            sha256sum sslim-linux-x86_64.tar.gz sslim-windows-x86_64.zip Blade.apk > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Write release notes
        shell: bash
        run: |
          cat > dist/RELEASE_NOTES.md <<'NOTES'
          ## SSLim 0.6.1 — Automatic TCP / QUIC v3 server setup

          This patch release improves compatibility and server administration
          without changing the established TCP v1 protocol or profile format.

          ### Fixed server transport experience
          - Linux menu: **Server and service → Auto transport TCP + QUIC v3**.
          - Set up UDP/QUIC v3 on the **same port as the current TCP listener**;
            preserve all existing client keys, certificates, addresses and unit flags.
          - Before changing systemd settings, save a private backup of the existing
            unit; automatically roll back if the changed service fails to start.
          - Preserve custom UDP port configurations instead of silently changing them.
          - New standard server installations enable TCP and UDP/QUIC v3 together
            on port 9443; upgrades intentionally preserve the old service settings,
            and UDP can then be enabled via the interactive Linux menu.
          - The separate experimental QUIC v2 interface is clearly marked
            **Legacy / not for Android Blade**.

          ### Platforms and compatibility
          - Linux CLI/server, Windows CLI and Android Blade 0.6.1 packages are included.
          - Old TCP v1 clients and sslim:// profiles stay compatible.
          - The Android Auto mode tries authenticated QUIC v3 first and falls
            back to TCP only if UDP is unavailable; authentication failures
            do not trigger a downgrade.
          - UDP needs the matching server option and an open firewall port.
          - UDP/QUIC v3 remains experimental; validate real-device connectivity,
            network transitions and VPN performance before wide deployment.
          - Back up /etc/sslim and the systemd unit before Linux upgrades.
            As with previous releases, a different Android APK signing key
            may prevent an in-place update, so back up Android profiles too.
          NOTES

      - name: Publish tag and all three packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag=v0.6.1
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving the published assets unchanged."
            exit 0
          fi
          gh release create "$tag" \
            dist/sslim-linux-x86_64.tar.gz \
            dist/sslim-windows-x86_64.zip \
            dist/Blade.apk \
            dist/SHA256SUMS \
            --target "$COMMIT_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SSLim v0.6.1 — Auto TCP / QUIC v3 compatibility fix" \
            --notes-file dist/RELEASE_NOTES.md
