name: Build packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - name: Verify Android menu and animation contracts
        run: python3 scripts/test-android-motion.py
      - run: cargo build --release --locked
      - name: Verify TCP compatibility with v0.2.0 servers
        run: python3 scripts/test-legacy-tcp.py target/release/sslim
      - name: Verify v0.1/v0.2 clients and newer clients against current server
        run: python3 scripts/test-legacy-clients.py target/release/sslim
      - name: Verify nested interactive CLI menu (PTY)
        run: python3 scripts/test-cli-menu.py target/release/sslim
      - name: Verify concurrent Linux tunnels
        run: sudo unshare --net python3 scripts/test-multi-tun.py target/release/sslim
      - run: tar -czf sslim-linux-x86_64.tar.gz -C target/release sslim
      - uses: actions/upload-artifact@v4
        with:
          name: sslim-linux-x86_64
          path: sslim-linux-x86_64.tar.gz
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package Blade
        run: |
          'exit' | target/release/sslim.exe
          if ($LASTEXITCODE -ne 0) { throw 'Blade console failed to start' }
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          if ((Get-FileHash wintun.zip).Hash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw 'Wintun checksum mismatch' }
          Expand-Archive wintun.zip wintun-pkg
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/sslim.exe,scripts/blade-routes.ps1,scripts/install.ps1,wintun-pkg/wintun/bin/amd64/wintun.dll,wintun-pkg/wintun/LICENSE.txt dist/
          Compress-Archive -Path dist/* -DestinationPath sslim-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sslim-windows-x86_64
          path: sslim-windows-x86_64.zip
  android-quic-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Test shared QUIC codec and JNI bridge
        run: cargo test --manifest-path android/native/Cargo.toml
      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build protected Android QUIC libraries
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t x86_64 -o android/jniLibs build --manifest-path android/native/Cargo.toml --release
          test -s android/jniLibs/arm64-v8a/libbladequic.so
          test -s android/jniLibs/x86_64/libbladequic.so
      - uses: actions/upload-artifact@v4
        with:
          name: Blade-QUIC-native
          path: android/jniLibs/
          if-no-files-found: error

  android:
    runs-on: windows-latest
    needs: android-quic-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Blade-QUIC-native
          path: android/jniLibs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        env:
          BLADE_SIGN_STORE: ${{ secrets.BLADE_SIGN_STORE }}
          BLADE_SIGN_PASS: ${{ secrets.BLADE_SIGN_PASS }}
        run: |
          $sdk = $env:ANDROID_HOME
          $manager = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $manager --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK components missing' }
          if ($env:BLADE_SIGN_STORE -and $env:BLADE_SIGN_PASS) {
            $store = Join-Path $env:RUNNER_TEMP 'blade-signing.p12'
            try {
              [IO.File]::WriteAllBytes($store, [Convert]::FromBase64String($env:BLADE_SIGN_STORE))
              ./android/build.ps1 -Sdk $sdk -Jdk $env:JAVA_HOME -SigningStore $store
            } finally {
              Remove-Item -LiteralPath $store -ErrorAction SilentlyContinue
            }
          } else {
            ./android/build.ps1 -Sdk $sdk -Jdk $env:JAVA_HOME
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Blade-Android
          path: android/build/Blade.apk
