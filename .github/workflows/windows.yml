name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Fetch Wintun
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive -Path wintun.zip -DestinationPath wintun-pkg
          Copy-Item wintun-pkg/wintun/bin/amd64/wintun.dll .

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/sslim.exe dist/
          Copy-Item scripts/blade-routes.ps1, scripts/install.ps1 dist/
          Copy-Item wintun.dll dist/
          Compress-Archive -Path dist/* -DestinationPath sslim-windows-x86_64.zip
          Get-FileHash sslim-windows-x86_64.zip -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: sslim-windows-x86_64
          path: sslim-windows-x86_64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sslim-windows-x86_64.zip
