[package]
name = "govpn-lab"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
libc = "0.2"
ring = "0.17"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
lto = "thin"
codegen-units = 1
